[package]
name = "print-layout-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "print_layout_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1.5"
fdeflate = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lopdf = { version = "0.47", default-features = false, features = ["wasm_js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
