[package]
name = "ieum-parse-sidecar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "ieum-parse-sidecar"
path = "src/main.rs"

[dependencies]
cfb = "0.15"
encoding_rs = "0.8"
flate2 = "1"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
